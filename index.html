<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAKISTAN SIM DATABASE | Raees KING</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-green: #39FF14;
            --cyber-teal: #00ff9d;
            --dark-matrix: #0a0a0a;
            --hacker-black: #030303;
            --glow-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background: var(--hacker-black);
            color: var(--neon-green);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 255, 157, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.02) 1px, transparent 1px),
                linear-gradient(rgba(0, 255, 157, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
        }

        .cyber-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
        }

        .cyber-header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
            padding: 2rem 0;
        }

        .cyber-border {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: 3px solid var(--neon-green);
            box-shadow: var(--glow-shadow);
            animation: borderGlow 2s infinite;
        }

        @keyframes borderGlow {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .main-title {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px var(--neon-green);
            margin-bottom: 1rem;
            position: relative;
        }

        .cyber-subtitle {
            color: var(--cyber-teal);
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .matrix-input {
            width: 100%;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            font-size: 1.2rem;
            margin: 2rem 0;
            transition: all 0.3s ease;
        }

        .matrix-input:focus {
            outline: none;
            box-shadow: var(--glow-shadow);
            background: rgba(0, 0, 0, 0.9);
        }

        .cyber-button {
            background: linear-gradient(45deg, var(--neon-green), var(--cyber-teal));
            padding: 1.5rem 3rem;
            border: none;
            border-radius: 0;
            color: var(--hacker-black);
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }

        .cyber-button:hover {
            transform: scale(1.05);
            box-shadow: var(--glow-shadow);
        }

        .cyber-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0.3),
                rgba(255, 255, 255, 0)
            );
            transform: rotate(45deg);
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .cyber-card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon-green);
            padding: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .cyber-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--glow-shadow);
        }

        .data-label {
            color: var(--cyber-teal);
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .social-links {
            text-align: center;
            margin: 3rem 0;
        }

        .social-button {
            display: inline-flex;
            align-items: center;
            margin: 0 1rem;
            padding: 1rem 2rem;
            background: rgba(0, 255, 157, 0.1);
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-button:hover {
            background: rgba(0, 255, 157, 0.3);
            transform: scale(1.1);
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(0, 255, 157, 0) 0%,
                rgba(0, 255, 157, 0.1) 10%,
                rgba(0, 255, 157, 0) 100%
            );
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .cyber-loader {
            width: 50px;
            height: 50px;
            border: 5px solid var(--neon-green);
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div class="cyber-container">
        <header class="cyber-header">
            <div class="cyber-border"></div>
            <h1 class="main-title">KHAN HACKER DATABASE</h1>
            <p class="cyber-subtitle">Premium SIM Information Verification System</p>
        </header>

        <div class="search-section">
            <input type="text" 
                   class="matrix-input" 
                   id="numberInput" 
                   placeholder="ENTER 11-DIGIT MOBILE NUMBER"
                   maxlength="11">
            <button class="cyber-button" id="searchBtn">
                <span id="btnText">INITIATE SCAN</span>
                <div class="cyber-loader" id="loader" style="display: none;"></div>
            </button>
        </div>

        <div class="social-links">
            <a href="https://whatsapp.com/channel/0029VasKR1s2UPBBf6yDnD25" class="social-button">
                <i class="fab fa-whatsapp"></i> WhatsApp CHANEL
            </a>
            <a href="https://youtube.com/@khanofficialchanel404?si=5NlQivQdlq5Smq_y" class="social-button">
                <i class="fab fa-telegram"></i> Youtube Chanel
            </a>
        </div>

        <div id="responseBox" class="result-grid"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchBtn = document.getElementById('searchBtn');
            const numberInput = document.getElementById('numberInput');
            const responseBox = document.getElementById('responseBox');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            searchBtn.addEventListener('click', async () => {
                const number = numberInput.value.trim();
                
                if (!number || number.length !== 11 || isNaN(number)) {
                    responseBox.innerHTML = `<div class="cyber-card"><p class="data-label">ERROR:</p><p>Invalid mobile number format</p></div>`;
                    return;
                }

                btnText.style.display = 'none';
                loader.style.display = 'block';
                searchBtn.disabled = true;

                try {
                    const apiUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://fam-official.serv00.net/sim/api.php?num=${number}`)}`;
                    const response = await fetch(apiUrl);
                    const result = await response.json();
                    const apiData = JSON.parse(result.contents);

                    if (apiData.status === "success" && apiData.data.length > 0) {
                        let formattedData = '';
                        apiData.data.forEach(user => {
                            formattedData += `
                                <div class="cyber-card">
                                    <p class="data-label">Name:</p>
                                    <p>${user.Name || "N/A"}</p>
                                    <p class="data-label">Mobile:</p>
                                    <p>${user.Mobile || "N/A"}</p>
                                    <p class="data-label">CNIC:</p>
                                    <p>${user.CNIC || "N/A"}</p>
                                    <p class="data-label">Operator:</p>
                                    <p>${user.Operator || "N/A"}</p>
                                    <p class="data-label">Address:</p>
                                    <p>${user.Address || "N/A"}</p>
                                </div>
                            `;
                        });
                        responseBox.innerHTML = formattedData;
                    } else {
                        responseBox.innerHTML = `<div class="cyber-card"><p class="data-label">ERROR:</p><p>No records found</p></div>`;
                    }
                } catch (error) {
                    responseBox.innerHTML = `<div class="cyber-card"><p class="data-label">ERROR:</p><p>${error.message}</p></div>`;
                } finally {
                    btnText.style.display = 'block';
                    loader.style.display = 'none';
                    searchBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
